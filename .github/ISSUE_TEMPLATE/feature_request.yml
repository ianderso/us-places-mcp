name: Feature request
description: A research question the tools cannot answer yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tools that write anywhere, or that scrape GLO Records, will not be merged. See "Out of scope, by decision" in [docs/DESIGN.md](https://github.com/ianderso/us-places-mcp/blob/main/docs/DESIGN.md).
  - type: textarea
    id: problem
    attributes:
      label: The research problem
      description: What you were trying to find or read, and where the current tools stopped you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: A new tool, a new parameter, or a change to what a tool returns.
  - type: textarea
    id: api
    attributes:
      label: Data source
      description: If you know which service or dataset would answer it.
